# SPDX-License-Identifier: Apache-2.0

# Bluetooth LE observer / scanner
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="DF-RSSI-Scanner"

# USB CDC-ACM console (nRF52840 Dongle default serial backend)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="DF Bluetooth RSSI Scanner"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y

# GPIO / LED
CONFIG_GPIO=y

# Heap for BT stack
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Quiet USB logs so JSON lines stay clean on the serial port
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_BT_LOG_LEVEL_ERR=y
