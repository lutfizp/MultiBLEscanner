services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bluetooth_scanner
      POSTGRES_USER: bluetooth
      POSTGRES_PASSWORD: bluetooth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluetooth -d bluetooth_scanner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

